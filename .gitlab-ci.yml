stages:
    - format
    - env

variables:
    VENV: "/home/gitlab-runner/venv-cinfer-ci"
    GIT_SUBMODULE_STRATEGY: recursive

before_script:
  - export CUR_COMMIT_ID=$(git rev-parse HEAD)

############################################################################################################
# Format

format_check:
    stage: format
    only:
        - merge_requests
    tags:
        - dev
    script:
        - source $VENV/bin/activate
        - pip install black -i https://pypi.tuna.tsinghua.edu.cn/simple
        - black --exclude src/third_party/ --exclude third_party/ --check .
        - source /home/spack/spack/share/spack/setup-env.sh
        - spack load --first llvm
        - find . -type f \( -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.cu' -o -name '*.cuh' \) -exec clang-format --dry-run -Werror {} +

############################################################################################################
# Build
env_build_cinfer_ascendc:
  stage: env
  only:
    - merge_requests
  tags:
    - huawei-4-910B
  needs:
    - format_check
  script:
    - CI_WORKSPACE=$(pwd)
    - |
      GRUN_DEVICES=7 grun docker run --rm \
      --name ${CUR_COMMIT_ID} \
      --device /dev/davinci7 \
      --device /dev/davinci_manager \
      --device /dev/devmm_svm \
      --device /dev/hisi_hdc \
      -v "${CI_WORKSPACE}:/workspace" \
      -w /workspace \
      -v /usr/local/dcmi:/usr/local/dcmi \
      -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
      -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
      -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
      -v /etc/ascend_install.info:/etc/ascend_install.info \
      quay.io/ascend/cann:8.3.rc1.alpha001-910b-ubuntu22.04-py3.11 bash -c "\
        pip install wheel -i https://pypi.tuna.tsinghua.edu.cn/simple && \
        pip install pybind11 -i https://pypi.tuna.tsinghua.edu.cn/simple && \
        pip install torch==2.6.0 -i https://pypi.tuna.tsinghua.edu.cn/simple && \
        pip install ./third_party/torch_npu-2.6.0.post1-cp311-cp311-manylinux_2_28_aarch64.whl -i https://pypi.tuna.tsinghua.edu.cn/simple && \
        cp -r /workspace /tmp && \
        cd /tmp/workspace && \
        pip install . && \
        python check_installed_ops.py && \
        cd grouped_gemm/test && \
        bash run_test.sh && 
        bash clean_test.sh && \
        cd ../../grouped_soft_gemv/test && \
        bash run_test.sh && \
        bash clean_test.sh \
      "
